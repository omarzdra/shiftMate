<!DOCTYPE html>

<html lang="sl"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;font-family:'Inter',sans-serif;}body{overscroll-behavior:none;background-color:#f9f9ff;color:#151c27;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"secondary-fixed-dim":"#c3c6cd","on-tertiary-container":"#ffd9ca","on-tertiary-fixed":"#351000","on-error-container":"#93000a","secondary-container":"#dde0e7","outline":"#747686","surface-container-low":"#f0f3ff","error":"#ba1a1a","tertiary-fixed-dim":"#ffb695","on-tertiary-fixed-variant":"#7c2e00","surface-container-high":"#e2e8f8","surface-bright":"#f9f9ff","primary-container":"#3158d9","inverse-on-surface":"#ebf1ff","primary":"#053dc0","on-primary-container":"#dbdfff","error-container":"#ffdad6","background":"#f9f9ff","tertiary-container":"#ab4300","surface-container-highest":"#dce2f3","tertiary":"#843200","on-secondary":"#ffffff","primary-fixed-dim":"#b7c4ff","surface-container":"#e7eefe","surface-tint":"#2a52d3","secondary":"#5b5f64","on-primary-fixed-variant":"#0038b7","on-primary":"#ffffff","inverse-surface":"#2a313d","on-error":"#ffffff","surface-variant":"#dce2f3","surface-dim":"#d3daea","on-surface":"#151c27","on-secondary-container":"#5f6369","secondary-fixed":"#e0e2e9","on-tertiary":"#ffffff","primary-fixed":"#dde1ff","inverse-primary":"#b7c4ff","surface-container-lowest":"#ffffff","on-primary-fixed":"#001452","outline-variant":"#c4c5d7","on-background":"#151c27","surface":"#f9f9ff","on-secondary-fixed":"#181c21","on-surface-variant":"#444654","on-secondary-fixed-variant":"#43474d","tertiary-fixed":"#ffdbcc"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{"space-xs":"0.25rem",gutter:"1rem","space-xl":"2rem","space-md":"1rem",margin:"1rem","space-sm":"0.5rem","space-lg":"1.5rem"},fontFamily:{"body-lg":["Inter"],"label-sm":["Inter"],"body-sm":["Inter"],caption:["Inter"],"title-sm":["Inter"],"body-md":["Inter"],"headline-sm":["Inter"],"label-md":["Inter"],"headline-md":["Inter"],"title-md":["Inter"],"headline-lg":["Inter"]},fontSize:{"body-lg":["16px",{lineHeight:"24px",letterSpacing:"-0.005em",fontWeight:"400"}],"label-sm":["11px",{lineHeight:"14px",letterSpacing:"0.03em",fontWeight:"500"}],"body-sm":["12px",{lineHeight:"16px",letterSpacing:"0.01em",fontWeight:"400"}],caption:["10px",{lineHeight:"12px",letterSpacing:"0.04em",fontWeight:"600"}],"title-sm":["14px",{lineHeight:"20px",letterSpacing:"0em",fontWeight:"600"}],"body-md":["14px",{lineHeight:"20px",letterSpacing:"0em",fontWeight:"400"}],"headline-sm":["18px",{lineHeight:"24px",letterSpacing:"-0.01em",fontWeight:"600"}],"label-md":["12px",{lineHeight:"16px",letterSpacing:"0.02em",fontWeight:"600"}],"headline-md":["22px",{lineHeight:"28px",letterSpacing:"-0.015em",fontWeight:"600"}],"title-md":["16px",{lineHeight:"22px",letterSpacing:"-0.005em",fontWeight:"600"}],"headline-lg":["28px",{lineHeight:"34px",letterSpacing:"-0.02em",fontWeight:"700"}]}}}};</script></head><body class="bg-surface text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col flex-1 relative w-full bg-surface"><div class="flex flex-col w-full px-space-md py-space-xl items-center justify-between min-h-[640px]">
<!-- Top Brand Anchor -->
<div class="flex flex-col items-center text-center mt-space-sm mb-space-lg w-full max-w-sm">
<div class="w-12 h-12 mb-space-sm rounded-xl bg-surface-container-lowest flex items-center justify-center shadow-sm overflow-hidden">
<img alt="ShiftMate Logotip" class="w-10 h-10 object-contain" src="https://lh3.googleusercontent.com/aida/ALJJyrD7N7VtE2SwWXfKfRiZlJwbgzOf4gbyoB3HeYrk1AO3mGnkZmWfrVdT0FlH0fa79eYkuv2TypWvHNJF1KbKzsZcH1QPoITv7zbiBwusQgYGqZuMBjf7VE8C8h5P6eLLusaUU0JmZDqlLGHAbkTNFFv8JUZ6aUvaQJUrDwDOAL2vc3iqc3xNNWekCxPClTUVgndOyaKFZ2dj7vvZmK96KQ6Ypcx9pXsKB73ziM6xjRg"/>
</div>
<h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">ShiftMate Business</h1>
<p class="font-body-md text-body-md text-secondary mt-1">Upravljanje izmen na enem mestu</p>
</div>
<!-- Main Card Form Container -->
<div class="w-full max-w-sm bg-surface-container-lowest rounded-xl shadow-sm p-space-md flex flex-col space-y-space-md">
<!-- Role Switch Toggle Bar -->
<div class="bg-surface-container p-1 rounded-lg flex items-center justify-between text-center select-none" id="role-toggle-group">
<button class="flex-1 py-1.5 px-2 rounded-md font-label-md text-label-md bg-surface-container-lowest text-on-surface shadow-sm transition-all duration-150 flex items-center justify-center gap-1.5" id="btn-role-owner" onclick="selectRole('owner')" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
<span class="truncate">Kavarna Center</span>
</button>
<button class="flex-1 py-1.5 px-2 rounded-md font-label-md text-label-md text-secondary hover:text-on-surface transition-all duration-150 flex items-center justify-center gap-1.5" id="btn-role-employee" onclick="selectRole('employee')" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-transparent" id="emp-dot"></span>
<span class="truncate">Ana Novak</span>
</button>
</div>
<form class="flex flex-col space-y-4" onsubmit="event.preventDefault(); simulateSubmit();">
<!-- Email Field -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="email">
<span>E-poštni naslov</span>
<span class="font-caption text-caption text-secondary font-normal uppercase tracking-wider" id="role-pill-label">Vodja enote</span>
</label>
<div class="relative flex items-center">
<input class="w-full h-12 px-3.5 bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface placeholder:text-secondary focus:bg-surface-container-lowest focus:outline-none transition-colors duration-150 shadow-inner" id="email" placeholder="ime@podjetje.si" required="" type="email" value="vodja@kavarnacenter.si"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password">Geslo</label>
<a class="font-label-md text-label-md text-primary-container hover:underline" href="#">Pozabljeno geslo?</a>
</div>
<div class="relative flex items-center">
<input class="w-full h-12 pl-3.5 pr-11 bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface placeholder:text-secondary focus:bg-surface-container-lowest focus:outline-none transition-colors duration-150 shadow-inner tracking-widest" id="password" placeholder="••••••••••••" required="" type="password" value="GesloShiftMate2024!"/>
<button aria-label="Prikaži geslo" class="absolute right-0 top-0 bottom-0 px-3.5 flex items-center justify-center text-secondary hover:text-on-surface transition-colors focus:outline-none" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Submit Primary Button -->
<button class="w-full h-12 bg-primary-container hover:bg-primary active:scale-[0.99] text-on-primary font-title-sm text-title-sm rounded-lg flex items-center justify-center gap-2 shadow-sm transition-all duration-150 mt-2 select-none" id="submit-btn" type="submit">
<span>Prijava</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center justify-center my-1">
<div class="w-full h-[1px] bg-surface-container-highest"></div>
<span class="absolute px-3 bg-surface-container-lowest font-caption text-caption text-secondary uppercase tracking-widest">ali</span>
</div>
<!-- Secondary Registration Option -->
<div class="text-center pt-1">
<p class="font-body-md text-body-md text-secondary">
        Nimate računa? 
        <a class="font-title-sm text-title-sm text-primary-container hover:underline ml-1" href="#">Ustvari račun</a>
</p>
</div>
</div>
<!-- Bottom Regulatory Footprint -->
<div class="flex items-center justify-center gap-1.5 mt-space-lg text-secondary select-none">
<span class="material-symbols-outlined text-[15px] text-secondary">lock</span>
<span class="font-label-sm text-label-sm tracking-tight">Varno šifriranje podatkov skladno z GDPR</span>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');
    if (!pwdInput || !eyeIcon) return;

    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      pwdInput.classList.remove('tracking-widest');
      eyeIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      pwdInput.classList.add('tracking-widest');
      eyeIcon.textContent = 'visibility';
    }
  }

  function selectRole(role) {
    const ownerBtn = document.getElementById('btn-role-owner');
    const empBtn = document.getElementById('btn-role-employee');
    const emailInput = document.getElementById('email');
    const rolePillLabel = document.getElementById('role-pill-label');
    const empDot = document.getElementById('emp-dot');

    if (role === 'owner') {
      ownerBtn.className = "flex-1 py-1.5 px-2 rounded-md font-label-md text-label-md bg-surface-container-lowest text-on-surface shadow-sm transition-all duration-150 flex items-center justify-center gap-1.5";
      empBtn.className = "flex-1 py-1.5 px-2 rounded-md font-label-md text-label-md text-secondary hover:text-on-surface transition-all duration-150 flex items-center justify-center gap-1.5";
      empDot.className = "w-1.5 h-1.5 rounded-full bg-transparent";
      emailInput.value = "vodja@kavarnacenter.si";
      rolePillLabel.textContent = "Vodja enote";
    } else {
      empBtn.className = "flex-1 py-1.5 px-2 rounded-md font-label-md text-label-md bg-surface-container-lowest text-on-surface shadow-sm transition-all duration-150 flex items-center justify-center gap-1.5";
      ownerBtn.className = "flex-1 py-1.5 px-2 rounded-md font-label-md text-label-md text-secondary hover:text-on-surface transition-all duration-150 flex items-center justify-center gap-1.5";
      empDot.className = "w-1.5 h-1.5 rounded-full bg-primary-container";
      emailInput.value = "ana.novak@kavarnacenter.si";
      rolePillLabel.textContent = "Zaposleni";
    }
  }

  function simulateSubmit() {
    const btn = document.getElementById('submit-btn');
    if (!btn) return;
    const initialText = btn.innerHTML;
    btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span><span>Prijava poteka...</span>`;
    btn.disabled = true;
    setTimeout(() => {
      btn.innerHTML = `<span class="material-symbols-outlined text-[18px]">check</span><span>Uspešno</span>`;
      setTimeout(() => {
        btn.innerHTML = initialText;
        btn.disabled = false;
      }, 1200);
    }, 900);
  }
</script></main></body></html>
